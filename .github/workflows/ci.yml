name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: |
          python scripts/fund_strategy.py signal --pe-percentile 34.8 --price 1.1138 --ma250 1.27 --rsi6 8.7
          python scripts/fund_strategy.py dca --drawdown 8.3 --daily-budget 40
          python scripts/fund_strategy.py exit-check --asset-type qdii --pe-percentile 60 --gain 26 --dd-20d 9
          python scripts/fund_strategy.py exit-check --asset-type gold --ma-deviation 22 --rsi6 76
          python scripts/fund_strategy.py exit-check --asset-type a --gain 26 --dd-20d 9 --atr-pct 5
          python scripts/fund_backtest.py --demo --sweep dd
          python scripts/fund_backtest.py --demo --rsi-confirm 2 --dca-interval 5 --exit-cooldown 20
          python scripts/fund_backtest.py --demo --budget-rollover
